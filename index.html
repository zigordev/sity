<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sity</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Sity mainland baseline"></canvas>
      <aside class="compass" aria-label="Compass north points from mainland toward the sea">
        <div class="compass-ring">
          <div id="compass-needle" class="compass-needle" aria-hidden="true">
            <span>N</span>
          </div>
          <span class="compass-center" aria-hidden="true"></span>
        </div>
      </aside>
      <aside class="axis-scale" aria-label="Scale axes in meters">
        <div class="axis-scale-stage" aria-hidden="true">
          <span class="axis-scale-center"></span>
          <span id="scale-axis-x" class="axis-scale-arm axis-scale-x"><span>X</span></span>
          <span id="scale-axis-y" class="axis-scale-arm axis-scale-y"><span>Y</span></span>
          <span id="scale-axis-z" class="axis-scale-arm axis-scale-z"><span>Z</span></span>
        </div>
        <div class="axis-scale-measures">
          <span><strong>X</strong><span id="scale-measure-x"></span></span>
          <span><strong>Y</strong><span id="scale-measure-y"></span></span>
          <span><strong>Z</strong><span id="scale-measure-z"></span></span>
        </div>
      </aside>
      <aside class="layer-panel" aria-label="Element visibility controls">
        <div class="layer-panel-title">Elements</div>
        <label>
          <input id="toggle-natural" type="checkbox" checked />
          <span>Natural</span>
        </label>
        <label>
          <input id="toggle-artificial" type="checkbox" checked />
          <span>Artificial</span>
        </label>
        <label>
          <input id="toggle-roads" type="checkbox" checked />
          <span>Roads</span>
        </label>
        <label>
          <input id="toggle-help" type="checkbox" checked />
          <span>Help</span>
        </label>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
