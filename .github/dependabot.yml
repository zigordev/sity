version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
