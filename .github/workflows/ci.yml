name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, build and render verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for attempt in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not start" >&2
          exit 1

      - name: Verify render
        env:
          SITY_VERIFY_BASE_URL: http://127.0.0.1:4173
          SITY_VERIFY_OUT_DIR: verify-output
        run: npm run verify:render

      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: render-verification
          path: verify-output
          if-no-files-found: ignore
