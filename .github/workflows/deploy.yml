name: Deploy AWS App (EC2 Compose)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (example: v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-aws-prod-sity
  cancel-in-progress: false

jobs:
  build-and-push:
    permissions:
      contents: read
      id-token: write
    name: Build + Push + Bundle
    runs-on: ubuntu-latest
    environment: production

    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      web_image: ${{ steps.images.outputs.web_image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.ref || inputs.release_tag }}

      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            raw_tag="$RELEASE_TAG"
          else
            raw_tag="$INPUT_TAG"
          fi

          if [ -z "$raw_tag" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          safe_tag="$(printf '%s' "$raw_tag" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"
          if [ -z "$safe_tag" ]; then
            echo "Release tag '$raw_tag' became empty after sanitization" >&2
            exit 1
          fi

          echo "release_tag=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$safe_tag" >> "$GITHUB_OUTPUT"

      - name: Validate required deploy variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECR_WEB_REPOSITORY_URI: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          AWS_DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ECR_WEB_REPOSITORY_URI
            AWS_DEPLOY_BUCKET
            AWS_DEPLOY_INSTANCE_ID
          )
          for name in "${required[@]}"; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "Missing GitHub environment variable: $name" >&2
              exit 1
            fi
          done

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build + push web image
        id: images
        env:
          WEB_REPO: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          web_image="${WEB_REPO}:${IMAGE_TAG}"
          web_repo_name="${WEB_REPO#*/}"

          if aws ecr describe-images --repository-name "$web_repo_name" --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Web image already exists in ECR with immutable tag, reusing: $web_image"
          else
            docker build -f apps/web/Dockerfile --target prod -t "$web_image" .
            docker push "$web_image"
          fi
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"

      - name: Resolve pushed image digests
        id: digests
        env:
          WEB_REPOSITORY: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail

          resolve() {
            repo_uri="$1"
            repo_name="${repo_uri#*/}"
            digest="$(aws ecr describe-images \
              --repository-name "$repo_name" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"

            if [ -z "$digest" ] || [ "$digest" = "None" ]; then
              echo "Could not resolve digest for ${repo_uri}:${IMAGE_TAG}" >&2
              exit 1
            fi
            printf '%s@%s' "$repo_uri" "$digest"
          }

          web_ref="$(resolve "$WEB_REPOSITORY")"

          echo "web_ref=$web_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved web_ref: $web_ref"

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.web_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM (web image)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.digests.outputs.web_ref }}
          format: spdx-json
          output-file: artifacts/sbom-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM files
        run: |
          set -euo pipefail
          test -s artifacts/sbom-web.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-web.spdx.json > /dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGES: ${{ steps.digests.outputs.web_ref }}
        run: |
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            cosign sign --yes "$image"
            echo "signed: $image"
          done

      - name: Attach SLSA provenance
        env:
          IMAGES: ${{ steps.digests.outputs.web_ref }}
          BUILD_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          cat > /tmp/provenance.json <<JSON
          {
            "buildType": "https://github.com/actions/runner",
            "builder": { "id": "https://github.com/${BUILD_REPO}/actions/runs/${BUILD_RUN}" },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${BUILD_REPO}@${BUILD_REF}",
                "digest": { "sha1": "${BUILD_SHA}" },
                "entryPoint": ".github/workflows/deploy.yml"
              }
            }
          }
          JSON
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            cosign attest --yes --predicate /tmp/provenance.json --type slsaprovenance "$image"
            echo "attested: $image"
          done

      - name: Attach SBOM attestations
        env:
          WEB_REF: ${{ steps.digests.outputs.web_ref }}
        run: |
          set -euo pipefail
          cosign attest --yes --predicate artifacts/sbom-web.spdx.json --type spdxjson "$WEB_REF"
          echo "sbom attested: $WEB_REF"

      - name: Bundle deploy artifacts to S3
        env:
          BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git archive --format=tar.gz --output "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" HEAD
          aws s3 cp \
            "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" \
            "s3://${BUCKET}/releases/sity/${IMAGE_TAG}/deploy-bundle.tar.gz"

  deploy-app:
    permissions:
      contents: read
      id-token: write
    name: Remote App Deploy via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Trigger remote deploy via SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
        run: |
          set -euo pipefail
          payload_file="$(mktemp)"
          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg region "$AWS_REGION" \
            --arg bucket "$BUCKET" \
            --arg release "$IMAGE_TAG" \
            --arg web_image "$WEB_IMAGE" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [
                  "set -euo pipefail",
                  "BASE_DIR=\"/opt/sity\"",
                  "RELEASE_DIR=\"$BASE_DIR/releases/\($release)\"",
                  "mkdir -p \"$BASE_DIR/releases\"",
                  "rm -rf \"$RELEASE_DIR\"",
                  "mkdir -p \"$RELEASE_DIR\"",
                  "aws s3 cp \"s3://\($bucket)/releases/sity/\($release)/deploy-bundle.tar.gz\" \"/tmp/sity-\($release).tar.gz\" --region \($region)",
                  "tar -xzf \"/tmp/sity-\($release).tar.gz\" -C \"$RELEASE_DIR\"",
                  "cd \"$RELEASE_DIR\"",
                  "chmod +x scripts/prod-deploy-remote.sh",
                  "./scripts/prod-deploy-remote.sh --release-dir \"$RELEASE_DIR\" --region \"\($region)\" --web-image \"\($web_image)\" --release-tag \"\($release)\""
                ]
              }
            }' > "$payload_file"
          command_id="$(aws ssm send-command --cli-input-json "file://${payload_file}" --query 'Command.CommandId' --output text)"

          echo "SSM command: $command_id"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true

          status="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text >&2
            echo "Deploy failed with status: $status" >&2
            exit 1
          fi

  post-deploy-smoke:
    name: Post Deploy Smoke
    runs-on: ubuntu-latest
    environment: production
    needs: [build-and-push, deploy-app]

    steps:
      - name: Smoke health check
        if: ${{ vars.DEPLOY_HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          body="$(curl -fsS "$HEALTHCHECK_URL")"
          printf '%s' "$body" | grep -q '"status":"ok"'
          printf '%s' "$body" | grep -q "\"release\":\"${RELEASE_TAG}\""
          echo "Health check passed: $HEALTHCHECK_URL ($RELEASE_TAG)"
