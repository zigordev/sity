name: sity-app-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
    labels: 'com.docker.compose.project,com.docker.compose.service'

services:
  sity_web:
    security_opt:
      - no-new-privileges:true
    init: true
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      OTEL_SERVICE_NAME: sity-web
      APP_RELEASE: ${APP_RELEASE:?APP_RELEASE is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks:
      platform_ops_shared:
        aliases:
          - sity-web

networks:
  platform_ops_shared:
    name: platform_ops_shared
    external: true
